<div class="confirm-container">
      <div class="confirm-card">
        <div class="header">
          <div class="logo">✉️</div>
          <h2>Verify Your Email</h2>
          <p class="subtitle">We've sent a verification code to your email address</p>
        </div>

        <!-- Error Alert -->
        <div *ngIf="error" class="error-alert">
          <span class="error-icon">⚠️</span>
          <span>{{ error }}</span>
          <button class="close-error" (click)="error = ''">×</button>
        </div>

        <!-- Success Alert -->
        <div *ngIf="successMessage" class="success-alert">
          <span class="success-icon">✓</span>
          <span>{{ successMessage }}</span>
        </div>

        <form (ngSubmit)="onConfirm()" #confirmForm="ngForm">
          <!-- Username Display (if not in URL) -->
          <div class="form-group" *ngIf="!username">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              [(ngModel)]="usernameInput"
              #usernameModel="ngModel"
              required
              placeholder="Enter your username"
            >
          </div>

          <!-- Confirmation Code -->
          <div class="form-group">
            <label for="code">Verification Code</label>
            <div class="code-input-wrapper">
              <input
                type="text"
                id="code"
                name="code"
                [(ngModel)]="code"
                #codeModel="ngModel"
                required
                pattern="[0-9]{6}"
                maxlength="6"
                placeholder="Enter 6-digit code"
                class="code-input"
              >
            </div>
            <div *ngIf="codeModel.invalid && codeModel.touched" class="error-message">
              <small *ngIf="codeModel.errors?.['required']">Code is required</small>
              <small *ngIf="codeModel.errors?.['pattern']">Please enter a valid 6-digit code</small>
            </div>
          </div>

          <!-- Resend Code Link -->
          <div class="resend-section">
            <span class="resend-text">Didn't receive the code?</span>
            <button 
              type="button" 
              class="resend-btn" 
              (click)="resendCode()"
              [disabled]="resendDisabled"
            >
              {{ resendDisabled ? `Resend in ${countdown}s` : 'Resend Code' }}
            </button>
          </div>

          <!-- Submit Button -->
          <button 
            type="submit" 
            class="confirm-btn"
            [disabled]="confirmForm.invalid || isLoading"
          >
            <span *ngIf="!isLoading">Verify Account</span>
            <span *ngIf="isLoading" class="loading-spinner"></span>
          </button>

          <!-- Links -->
          <div class="links">
            <a routerLink="/login" class="link">← Back to Login</a>
            <a routerLink="/register" class="link">Create new account</a>
          </div>
        </form>
      </div>
    </div>
